version: '3.8'

services:
  # ===== БАЗА ДАНИХ =====
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: reading_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ===== MINIO (OBJECT STORAGE) =====
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API порт (для завантаження файлів)
      - "9001:9001"   # Web Console (для перегляду файлів)
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # ===== INIT BUCKET (автоматичне створення bucket) =====
  create-buckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/reading-audio || true;
      mc policy set public myminio/reading-audio;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data: